[project]
name = "llm-wiki-karpathy"
version = "0.1.0"
description = "Local wiki workflow tooling"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.hatch.envs.default]
python = "3"
installer = "uv"
skip-install = true
dependencies = [
  "beautifulsoup4>=4.12.0",
  "httpx>=0.28.0",
  "openai>=1.59.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "streamlit>=1.38.0",
  "ty>=0.0.1a17",
]

[tool.hatch.envs.lint]
template = "default"

[tool.hatch.envs.lint.scripts]
check = [
  "ruff check .",
  "ty check .",
]
format = [
  "ruff format .",
]

[tool.hatch.envs.default.scripts]
dashboard = [
  "streamlit run src/dashboard/app.py {args}",
]
llm-ingest = [
  "streamlit run src/dashboard/app.py {args}",
]
ingest-manifest = [
  "python -m src.pipeline.ingest_manifest {args}",
]
ingest-queue = [
  "python -m src.ingest_queue {args}",
]
readwise-dedupe = [
  "python -m src.readwise.dedupe_cli {args}",
]
readwise-rebuild-index = [
  "python -m src.readwise.rebuild {args}",
]
readwise-sync = [
  "python -m src.readwise {args}",
]
review-summary = [
  "python -m src.ingest_review.finished_reviews_summary {args}",
]
tag-migrate = [
  "python -m src.ingest_review.tag_migration {args}",
]
wiki-lint = [
  "python -m src.wiki_lint {args}",
]
wiki-render = [
  "python -m src.wiki_render {args}",
]
wiki-reset = [
  "python -m src.wiki_reset {args}",
]

[tool.hatch.envs.test]
template = "default"

[tool.hatch.envs.test.scripts]
run = [
  "pytest -q",
]
cov = [
  "pytest --cov=. --cov-report=term-missing --cov-report=xml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".hatch",
  ".venv",
  "raw",
  "wiki",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "raw/*",
  "wiki/*",
]
