[project]
name = "llm-wiki-karpathy"
version = "0.1.0"
description = "Local wiki workflow tooling"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
skip-install = true
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "openai>=1.59.0",
  "playwright>=1.49.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "streamlit>=1.38.0",
  "ty>=0.0.1a17",
  "uvicorn>=0.35.0",
]

[tool.hatch.envs.lint]
template = "default"

[tool.hatch.envs.lint.scripts]
check = [
  "ruff check .",
  "ty check .",
]
format = [
  "ruff format .",
]

[tool.hatch.envs.default.scripts]
dashboard = [
  "streamlit run src/dashboard/app.py {args}",
]
llm-ingest = [
  "streamlit run src/dashboard/app.py {args}",
]
ingest-manifest = [
  "python -m src.pipeline.ingest_manifest {args}",
]
ingest-queue = [
  "python -m src.ingest_queue {args}",
]
ingest-preanalyze = [
  "python -m src.ingest_batch.cli {args}",
]
medium-to-readwise = [
  "python -m src.medium_to_readwise.cli {args}",
]
management-api = [
  "python -m src.management_web.app {args}",
]
management-ui = [
  "npm --prefix web/management run dev -- {args}",
]
server = [
  "bash scripts/server_llm_wiki.sh ssh {args}",
]
server-status = [
  "bash scripts/server_llm_wiki.sh status {args}",
]
server-compose = [
  "bash scripts/server_llm_wiki.sh compose {args}",
]
server-health = [
  "bash scripts/server_llm_wiki.sh health {args}",
]
readwise-dedupe = [
  "python -m src.readwise.dedupe_cli {args}",
]
readwise-rebuild-index = [
  "python -m src.readwise.rebuild {args}",
]
readwise-sync = [
  "python -m src.readwise {args}",
]
review-summary = [
  "python -m src.ingest_review.finished_reviews_summary {args}",
]
tag-migrate = [
  "python -m src.ingest_review.tag_migration {args}",
]
wiki-lint = [
  "python -m src.wiki_lint {args}",
]
wiki-cleanup = [
  "python -m src.wiki_ops.cleanup_cli {args}",
]
wiki-vault-cleanup = [
  "python -m src.wiki_ops.vault_cleanup_cli {args}",
]
wiki-retire-repo-data = [
  "python -m src.wiki_ops.retire_repo_data_cli {args}",
]
wiki-ops-status = [
  "python -m src.wiki_ops.status_cli {args}",
]
wiki-render = [
  "python -m src.wiki_render {args}",
]
wiki-synthesis-indexes = [
  "python -m src.wiki_synthesis.indexes_cli {args}",
]
wiki-synthesis-cache-lint = [
  "python -m src.wiki_synthesis.cache_lint_cli {args}",
]
wiki-synthesis-doctor = [
  "python -m src.wiki_synthesis.doctor_cli {args}",
]
wiki-synthesis-plan = [
  "python -m src.wiki_synthesis {args}",
]
wiki-synthesis-select = [
  "python -m src.wiki_synthesis.select_cli {args}",
]
wiki-synthesis-batch = [
  "python -m src.wiki_synthesis.batch_cli {args}",
]
wiki-synthesis-prompt = [
  "python -m src.wiki_synthesis.prompt_cli {args}",
]
wiki-synthesis-run = [
  "python -m src.wiki_synthesis.run_cli {args}",
]
wiki-synthesis-review = [
  "python -m src.wiki_synthesis.review_cli {args}",
]
wiki-synthesis-workflow = [
  "python -m src.wiki_synthesis.workflow_cli {args}",
]
wiki-reset = [
  "python -m src.wiki_reset {args}",
]

[tool.hatch.envs.test]
template = "default"

[tool.hatch.envs.test.scripts]
run = [
  "pytest -q",
]
cov = [
  "pytest --cov=. --cov-report=term-missing --cov-report=xml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".hatch",
  ".venv",
  "raw",
  "wiki",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "raw/*",
  "wiki/*",
]
