name: Deploy LLM Wiki

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: llm-wiki-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Hatch and uv
        run: python -m pip install --upgrade hatch uv

      - name: Use uv in Hatch
        run: hatch config set installer uv

      - name: Run lint and type checks
        run: hatch run lint:check

      - name: Run tests
        run: hatch run test:run

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/management/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web/management ci

      - name: Lint frontend
        run: npm --prefix web/management run lint

      - name: Test frontend
        run: npm --prefix web/management run test -- --run

      - name: Build frontend
        run: npm --prefix web/management run build

      - name: Create empty CI env files for compose config
        run: |
          touch .env
          cp deploy/llm-wiki.env.example deploy/llm-wiki.env
          cp config/wiki_paths.server.example.toml config/wiki_paths.server.toml

      - name: Validate compose file
        # Always use -q: without it, Compose prints resolved env values.
        run: docker compose -f compose.llm-wiki.yml config -q

      - name: Build LLM Wiki images
        run: |
          docker compose -f compose.llm-wiki.yml build llm-wiki-api llm-wiki-frontend

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify
    environment: production

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

      - name: Deploy selected branch
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' \
            && git fetch --prune origin \
            && git checkout '${DEPLOY_BRANCH}' \
            && git pull --ff-only origin '${DEPLOY_BRANCH}' \
            && docker compose -f compose.llm-wiki.yml build llm-wiki-api llm-wiki-frontend \
            && docker compose -f compose.llm-wiki.yml up -d --remove-orphans --force-recreate llm-wiki-api llm-wiki-frontend"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ inputs.branch }}

      - name: Check deployed health
        env:
          LLM_WIKI_HEALTH_URL: ${{ secrets.LLM_WIKI_HEALTH_URL }}
          LLM_WIKI_BASIC_AUTH_USER: ${{ secrets.LLM_WIKI_BASIC_AUTH_USER }}
          LLM_WIKI_BASIC_AUTH_PASSWORD: ${{ secrets.LLM_WIKI_BASIC_AUTH_PASSWORD }}
        run: ./scripts/check_llm_wiki_deploy_health.sh
